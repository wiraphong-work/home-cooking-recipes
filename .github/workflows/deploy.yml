name: Deploy to GitHub Pages

on:
  # Push เข้า main → deploy อัตโนมัติ
  push:
    branches: [main]

  # กดปุ่มจาก GitHub Actions tab → manual deploy
  workflow_dispatch:

# สิทธิ์ที่ต้องใช้สำหรับ deploy GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# ป้องกัน deploy ทับซ้อนกัน (ถ้า push เร็วๆ จะรอ deploy ครั้งก่อนเสร็จก่อน)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
